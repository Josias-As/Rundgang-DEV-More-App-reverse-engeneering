- conPlTermine:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =clrRahmen
      BorderThickness: =1
      Fill: =clrKarte
      Height: =Parent.Height - 140
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Width: =Parent.Width - 1006
      X: =982
      Y: =116
    Children:
      - lblPlTermineTitel:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =15
            Text: ="Nächste Termine"
            Width: =Parent.Width - 32
            X: =16
            Y: =8
      - galPlTermine:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Nächste Termine"
            Height: =Parent.Height - 52
            Items: |-
              =FirstN(Filter(ForAll(Sequence(120, 0) As i, {D: DateAdd(Today(), i.Value, TimeUnit.Days)}), CountRows(Filter(colPlanR As p, Coalesce(p.Aktiv, false) && fnPlanPasst(p.StartMontag, p.GueltigBis, p.Wochentag, p.ZyklusWochen, D))) > 0), 12)
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =34
            Width: =Parent.Width - 32
            X: =16
            Y: =44
          Children:
            - lblPlTermin:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =34
                  Size: =13
                  Text: =Text(ThisItem.D, "dddd, dd.mm.yyyy", "de-DE") & If(ThisItem.D = Today(), "  (heute)", "")
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - lblPlKeine:
          Control: Label@2.5.1
          Properties:
            Color: =clrTextGrau
            Font: =Font.'Segoe UI'
            Height: =40
            Size: =13
            Text: ="Keine Termine in den nächsten 120 Tagen."
            Visible: =IsEmpty(galPlTermine.AllItems)
            Width: =Parent.Width - 32
            X: =16
            Y: =48
