- conLiKopf:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderThickness: =0
      Fill: =clrPrimaer
      Height: =64
      Width: =Parent.Width
    Children:
      - lblLiTitel:
          Control: Label@2.5.1
          Properties:
            Color: =Color.White
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =22
            Text: ="Rundgang-Builder"
            Width: =500
            X: =24
            Y: =0
      - lblLiNutzer:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =Color.White
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =13
            Text: =User().FullName
            Width: =400
            X: =Parent.Width - 424
            Y: =0
