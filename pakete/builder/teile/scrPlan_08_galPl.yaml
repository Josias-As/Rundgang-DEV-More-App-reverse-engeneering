- galPl:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      AccessibleLabel: ="Planzeilen"
      Height: =Parent.Height - 220
      Items: =Sort(colPlanR, ID)
      ShowScrollbar: =true
      TemplatePadding: =0
      TemplateSize: =72
      Width: =934
      X: =24
      Y: =140
    Children:
      - conPlKarte:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =clrRahmen
            BorderThickness: =1
            Fill: =If(Coalesce(ThisItem.Aktiv, false), clrKarte, clrGesperrtHell)
            Height: =Parent.TemplateHeight - 8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.TemplateWidth
            X: =0
            Y: =4
          Children:
            - ddPlTag:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Wochentag"
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  ChevronBackground: =clrPrimaer
                  ChevronFill: =Color.White
                  ChevronHoverBackground: =ColorFade(clrPrimaer, -20%)
                  ChevronHoverFill: =Color.White
                  Color: =clrText
                  Default: =fnWochentag(ThisItem.Wochentag)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverFill: =clrPrimaerHell
                  Items: |-
                    =Table({W: 1, N: "Montag"}, {W: 2, N: "Dienstag"}, {W: 3, N: "Mittwoch"}, {W: 4, N: "Donnerstag"}, {W: 5, N: "Freitag"}, {W: 6, N: "Samstag"}, {W: 7, N: "Sonntag"})
                  Items.Value: =N
                  OnChange: |-
                    =If(!IsBlank(Self.Selected) && Self.Selected.W <> ThisItem.Wochentag,
                        Set(varPatchFehler, false);
                        IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {Wochentag: Self.Selected.W, Title: Left(varPlanRg.Title & " – " & Self.Selected.N, 255)}), Set(varPatchFehler, true));
                        If(varPatchFehler,
                            Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                            Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                        )
                    )
                  PaddingLeft: =10
                  PressedColor: =Color.White
                  PressedFill: =clrPrimaer
                  SelectionColor: =Color.White
                  SelectionFill: =clrPrimaer
                  Size: =14
                  Width: =180
                  X: =16
                  Y: =14
            - ddPlZyklus:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Rhythmus"
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  ChevronBackground: =clrPrimaer
                  ChevronFill: =Color.White
                  ChevronHoverBackground: =ColorFade(clrPrimaer, -20%)
                  ChevronHoverFill: =Color.White
                  Color: =clrText
                  Default: =fnZyklus(ThisItem.ZyklusWochen)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverFill: =clrPrimaerHell
                  Items: |-
                    =Table({W: 1, N: "jede Woche"}, {W: 2, N: "alle 2 Wochen"}, {W: 3, N: "alle 3 Wochen"}, {W: 4, N: "alle 4 Wochen"})
                  Items.Value: =N
                  OnChange: |-
                    =If(!IsBlank(Self.Selected) && Self.Selected.W <> Coalesce(ThisItem.ZyklusWochen, 1),
                        Set(varPatchFehler, false);
                        IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {ZyklusWochen: Self.Selected.W}), Set(varPatchFehler, true));
                        If(varPatchFehler,
                            Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                            Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                        )
                    )
                  PaddingLeft: =10
                  PressedColor: =Color.White
                  PressedFill: =clrPrimaer
                  SelectionColor: =Color.White
                  SelectionFill: =clrPrimaer
                  Size: =14
                  Width: =190
                  X: =204
                  Y: =14
            - lblPlAb:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =40
                  Size: =13
                  Text: ="ab"
                  Width: =26
                  X: =400
                  Y: =14
            - dpPlStart:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  AccessibleLabel: ="Startwoche (es zählt der Montag)"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  DefaultDate: =ThisItem.StartMontag
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Format: =DateTimeFormat.ShortDate
                  Height: =40
                  IconBackground: =clrPrimaer
                  IconFill: =Color.White
                  OnChange: |-
                    =If(!IsBlank(Self.SelectedDate) && fnMontag(Self.SelectedDate) <> ThisItem.StartMontag,
                        Set(varPatchFehler, false);
                        IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {StartMontag: fnMontag(Self.SelectedDate)}), Set(varPatchFehler, true));
                        If(varPatchFehler,
                            Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                            Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                        )
                    )
                  Size: =14
                  StartOfWeek: =StartOfWeek.Monday
                  Width: =150
                  X: =428
                  Y: =14
            - lblPlBis:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =40
                  Size: =13
                  Text: ="bis"
                  Width: =30
                  X: =584
                  Y: =14
            - dpPlBis:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  AccessibleLabel: ="Gültig bis (leer = unbegrenzt)"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  DefaultDate: =ThisItem.GueltigBis
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Format: =DateTimeFormat.ShortDate
                  Height: =40
                  IconBackground: =clrPrimaer
                  IconFill: =Color.White
                  InputTextPlaceholder: ="unbegrenzt"
                  OnChange: |-
                    =If(!IsBlank(Self.SelectedDate) && Self.SelectedDate <> ThisItem.GueltigBis,
                        Set(varPatchFehler, false);
                        IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {GueltigBis: Self.SelectedDate}), Set(varPatchFehler, true));
                        If(varPatchFehler,
                            Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                            Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                        )
                    )
                  Size: =14
                  StartOfWeek: =StartOfWeek.Monday
                  Width: =150
                  X: =616
                  Y: =14
            - btnPlBisWeg:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: |-
                    =If(!IsBlank(ThisItem.GueltigBis),
                        Set(varPatchFehler, false);
                        IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {GueltigBis: Blank()}), Set(varPatchFehler, true));
                        If(varPatchFehler,
                            Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                            Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                        );
                        Reset(dpPlBis)
                    )
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =13
                  Text: ="✕"
                  Width: =36
                  X: =770
                  Y: =14
            - btnPlAktiv:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(Coalesce(ThisItem.Aktiv, false), clrErfolg, clrRahmen)
                  BorderThickness: =1
                  Color: =If(Coalesce(ThisItem.Aktiv, false), clrErfolg, clrTextGrau)
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(Coalesce(ThisItem.Aktiv, false), clrErfolgHell, clrKarte)
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: |-
                    =Set(varPatchFehler, false);
                    IfError(Patch(RG_Plan, LookUp(RG_Plan, ID = ThisItem.ID), {Aktiv: !Coalesce(ThisItem.Aktiv, false)}), Set(varPatchFehler, true));
                    If(varPatchFehler,
                        Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                        Patch(colPlanR, LookUp(colPlanR, ID = ThisItem.ID), LookUp(RG_Plan, ID = ThisItem.ID))
                    )
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =13
                  Text: =If(Coalesce(ThisItem.Aktiv, false), "aktiv", "pausiert")
                  Width: =100
                  X: =814
                  Y: =14
