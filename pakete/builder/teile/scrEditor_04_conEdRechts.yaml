- conEdRechts:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =clrRahmen
      BorderThickness: =1
      Fill: =clrKarte
      Height: =Parent.Height - 64
      Width: =Parent.Width - 940
      X: =940
      Y: =64
    Children:
      - lblVsTitel:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =14
            Text: =Switch(varAuswahlEbene, 3, "Vorschau – so sieht es der Prüfer", 2, "Diese Seite enthält", 1, "Dieser Bereich enthält", "Vorschau")
            Width: =Parent.Width - 32
            X: =16
            Y: =6
      - conVsKarte:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =clrRahmen
            BorderThickness: =1
            Fill: =clrKarte
            Height: =300
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =varAuswahlEbene = 3
            Width: =Parent.Width - 32
            X: =16
            Y: =40
          Children:
            - lblVsFrage:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  Size: =15
                  Text: =LookUp(colP, ID = varAuswahlID).Title & If(Coalesce(LookUp(colP, ID = varAuswahlID).Pflicht, false), " *", "")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =8
            - lblVsHinweis:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =22
                  Size: =12
                  Text: =Coalesce(LookUp(colP, ID = varAuswahlID).Hinweis, "")
                  Width: =Parent.Width - 32
                  Wrap: =false
                  X: =16
                  Y: =52
            - btnVsIO:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrErfolg
                  DisabledColor: =clrErfolg
                  DisabledFill: =clrErfolgHell
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =14
                  Text: ="i.O."
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "IONIO")
                  Width: =120
                  X: =16
                  Y: =80
            - btnVsNIO:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrFehler
                  DisabledColor: =clrFehler
                  DisabledFill: =clrFehlerHell
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =14
                  Text: ="n.i.O."
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "IONIO")
                  Width: =120
                  X: =144
                  Y: =80
            - txtVsWert:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Vorschau Eingabe"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  Default: =""
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  FocusedBorderColor: =clrPrimaer
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HintText: =If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL"), "Wert", "Eingabe")
                  HoverBorderColor: =clrPrimaer
                  OnChange: =false
                  Size: =14
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL" || LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "TEXT")
                  Width: =If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL"), 160, Parent.Width - 32)
                  X: =16
                  Y: =80
            - lblVsEinheit:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Size: =14
                  Text: =Coalesce(LookUp(colP, ID = varAuswahlID).Einheit, "")
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL")
                  Width: =Parent.Width - 200
                  X: =184
                  Y: =80
            - ddVsAuswahl:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Vorschau Auswahl"
                  AllowEmptySelection: =true
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  ChevronBackground: =clrPrimaer
                  ChevronFill: =Color.White
                  ChevronHoverBackground: =ColorFade(clrPrimaer, -20%)
                  ChevronHoverFill: =Color.White
                  Color: =clrText
                  Default: =""
                  DisplayMode: =DisplayMode.Edit
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverFill: =clrPrimaerHell
                  Items: =Filter(Split(Coalesce(LookUp(colP, ID = varAuswahlID).Auswahlwerte, ""), ";"), Trim(Value) <> "")
                  Items.Value: =Value
                  OnChange: =false
                  PaddingLeft: =10
                  PressedColor: =Color.White
                  PressedFill: =clrPrimaer
                  SelectionColor: =Color.White
                  SelectionFill: =clrPrimaer
                  Size: =14
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "AUSWAHL")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsMehr:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =84
                  Size: =13
                  Text: =Concat(Filter(Split(Coalesce(LookUp(colP, ID = varAuswahlID).Auswahlwerte, ""), ";"), Trim(Value) <> "") As s, "☐ " & Trim(s.Value), Char(10))
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "MEHRFACH")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsDatum:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Size: =14
                  Text: |-
                    ="📅 TT.MM.JJJJ" & If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUMZEIT"), "     🕒 hh : mm", "")
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUM" || LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUMZEIT")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsRegeln:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =124
                  Size: =12
                  Text: |-
                    ="• " & If(Coalesce(LookUp(colP, ID = varAuswahlID).Pflicht, false), "Pflichtfrage", "freiwillig") & Char(10) & "• " & fnFotoText(fnFotoWert(LookUp(colP, ID = varAuswahlID).Foto.Value, Coalesce(LookUp(colP, ID = varAuswahlID).FotoMoeglich, false))) & Char(10) & "• Kommentar " & If(Coalesce(LookUp(colP, ID = varAuswahlID).KommentarPflicht, false), "immer Pflicht", "Pflicht bei Mangel") & If(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL", Char(10) & "• " & fnGrenzText(LookUp(colP, ID = varAuswahlID).MinWert, LookUp(colP, ID = varAuswahlID).MaxWert, LookUp(colP, ID = varAuswahlID).Einheit) & If(IsBlank(LookUp(colP, ID = varAuswahlID).MinWert) && IsBlank(LookUp(colP, ID = varAuswahlID).MaxWert), "", ", außerhalb: " & Switch(fnGrenzmodus(LookUp(colP, ID = varAuswahlID).Grenzmodus.Value), "Warnen", "Hinweis + Begründung", "Sperren", "nicht speicherbar", "Mangel")), "") & If(Coalesce(LookUp(colP, ID = varAuswahlID).BedingungPunkt, 0) <> 0, Char(10) & "• nur sichtbar, wenn „" & LookUp(colP, ID = LookUp(colP, ID = varAuswahlID).BedingungPunkt).Title & "“ = " & fnBedText(LookUp(colP, ID = varAuswahlID).BedingungWert), "") & If(Coalesce(LookUp(colP, ID = varAuswahlID).HinweisBildID, 0) > 0, Char(10) & "• mit Beispielbild", "")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =170
      - lblVsListe:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            Font: =Font.'Segoe UI'
            Height: =300
            Overflow: =Overflow.Scroll
            Size: =13
            Text: =If(varAuswahlEbene = 2, Concat(Sort(Filter(colP, KategorieID = varAuswahlID), RgReihenfolge * 1000000 + ID) As p, "• " & p.Title & "  (" & fnTypName(p.Eingabetyp.Value) & If(Coalesce(p.Pflicht, false), ", Pflicht", "") & If(Coalesce(p.BedingungPunkt, 0) <> 0, ", bedingt", "") & ")", Char(10)), varAuswahlEbene = 1, Concat(Sort(Filter(colK, BereichID = varAuswahlID), RgReihenfolge * 1000000 + ID) As k, "• " & k.Title & "  (" & CountRows(Filter(colP, KategorieID = k.ID)) & " Prüfpunkte)", Char(10)), "Links etwas antippen.")
            VerticalAlign: =VerticalAlign.Top
            Visible: =varAuswahlEbene <> 3
            Width: =Parent.Width - 32
            X: =16
            Y: =40
      - lblPrTitel:
          Control: Label@2.5.1
          Properties:
            Color: =If(CountRows(Filter(galPr.AllItems, Art = "Fehler")) > 0, clrFehler, clrErfolg)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =14
            Text: |-
              ="Prüfung: " & If(CountRows(Filter(galPr.AllItems, Art = "Fehler")) = 0, "keine Fehler", CountRows(Filter(galPr.AllItems, Art = "Fehler")) & " Fehler") & If(CountRows(Filter(galPr.AllItems, Art = "Hinweis")) > 0, ", " & CountRows(Filter(galPr.AllItems, Art = "Hinweis")) & " Hinweise", "")
            Width: =Parent.Width - 32
            X: =16
            Y: =350
      - galPr:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Prüfung des Rundgangs"
            Height: =Parent.Height - 392
            Items: |-
              =Sort(
                  Ungroup(
                      Table(
                          {T: Filter(Table({Art: "Fehler", Ebene: 0, ID: 0, KatID: 0, BerID: 0, Text: "Der Rundgang hat noch keinen Bereich. → „+ Bereich“"}), IsEmpty(colB))},
                          {T: ForAll(Filter(colB As b, IsEmpty(Filter(colK As k, k.BereichID = b.ID))) As b, {Art: "Fehler", Ebene: 1, ID: b.ID, KatID: 0, BerID: b.ID, Text: "Bereich „" & b.Title & "“ hat keine Kategorie."})},
                          {T: ForAll(Filter(colK As k, IsEmpty(Filter(colP As p, p.KategorieID = k.ID))) As k, {Art: "Fehler", Ebene: 2, ID: k.ID, KatID: k.ID, BerID: k.BereichID, Text: "Kategorie „" & k.Title & "“ hat keinen Prüfpunkt."})},
                          {T: ForAll(Filter(colB As b, Trim(Coalesce(b.Title, "")) = "") As b, {Art: "Fehler", Ebene: 1, ID: b.ID, KatID: 0, BerID: b.ID, Text: "Ein Bereich hat keinen Namen."})},
                          {T: ForAll(Filter(colK As k, Trim(Coalesce(k.Title, "")) = "") As k, {Art: "Fehler", Ebene: 2, ID: k.ID, KatID: k.ID, BerID: k.BereichID, Text: "Eine Kategorie hat keinen Namen."})},
                          {T: ForAll(Filter(colP As p, Trim(Coalesce(p.Title, "")) = "") As p, {Art: "Fehler", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "Ein Prüfpunkt hat keine Frage."})},
                          {T: ForAll(Filter(colP As p, (p.Eingabetyp.Value = "AUSWAHL" || p.Eingabetyp.Value = "MEHRFACH") && fnWerte(p.Auswahlwerte) < 2) As p, {Art: "Fehler", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: mindestens zwei Antwortmöglichkeiten eintragen."})},
                          {T: ForAll(Filter(colP As p, (p.Eingabetyp.Value = "AUSWAHL" || p.Eingabetyp.Value = "MEHRFACH") && fnWerteDoppelt(p.Auswahlwerte)) As p, {Art: "Fehler", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: eine Antwortmöglichkeit steht doppelt da."})},
                          {T: ForAll(Filter(colP As p, p.Eingabetyp.Value = "ZAHL" && !IsBlank(p.MinWert) && !IsBlank(p.MaxWert) && p.MinWert > p.MaxWert) As p, {Art: "Fehler", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: „ab“ ist größer als „bis“."})},
                          {T: ForAll(Filter(ForAll(Filter(colP As p0, Coalesce(p0.BedingungPunkt, 0) <> 0) As p, With({a: LookUp(colP As a0, a0.ID = p.BedingungPunkt)}, {ID: p.ID, KategorieID: p.KategorieID, Title: p.Title, G: If(IsBlank(a) || a.KategorieID <> p.KategorieID, "Die Bedingung zeigt auf eine Frage außerhalb dieser Kategorie.", Coalesce(a.BedingungPunkt, 0) <> 0, "Die Frage der Bedingung hat selbst eine Bedingung (nur eine Ebene erlaubt).", a.RgReihenfolge * 1000000 + a.ID > p.RgReihenfolge * 1000000 + p.ID, "Die Frage der Bedingung muss weiter oben stehen.", !fnBedGueltig(p.BedingungWert, a.Eingabetyp.Value, a.Auswahlwerte), "Der Wert der Bedingung passt nicht zu „" & a.Title & "“.", "")})), G <> "") As p, {Art: "Fehler", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: " & p.G})},
                          {T: ForAll(Filter(colP As p, p.Eingabetyp.Value = "ZAHL" && fnGrenzmodus(p.Grenzmodus.Value) <> "Mangel" && IsBlank(p.MinWert) && IsBlank(p.MaxWert)) As p, {Art: "Hinweis", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: „Außerhalb“ wirkt nur mit Grenzen (ab/bis)."})},
                          {T: ForAll(Filter(colP As p, p.Foto.Value = "Bei Mangel Pflicht" && p.Eingabetyp.Value <> "IONIO" && p.Eingabetyp.Value <> "ZAHL") As p, {Art: "Hinweis", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“: „Foto Pflicht bei Mangel“ wirkt nur bei i.O./n.i.O. und Zahl."})},
                          {T: ForAll(Filter(colP As p, CountRows(Filter(colP As q, q.KategorieID = p.KategorieID && Lower(Trim(q.Title)) = Lower(Trim(p.Title)))) > 1) As p, {Art: "Hinweis", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "„" & p.Title & "“ steht in der Kategorie doppelt."})},
                          {T: ForAll(Filter(colP As p, p.Title = "Neue Frage") As p, {Art: "Hinweis", Ebene: 3, ID: p.ID, KatID: p.KategorieID, BerID: LookUp(colK As k9, k9.ID = p.KategorieID).BereichID, Text: "Eine Frage heißt noch „Neue Frage“."})},
                          {T: ForAll(Filter(colK As k, CountRows(Filter(colP As p, p.KategorieID = k.ID)) > 30) As k, {Art: "Hinweis", Ebene: 2, ID: k.ID, KatID: k.ID, BerID: k.BereichID, Text: "Kategorie „" & k.Title & "“ hat über 30 Prüfpunkte (lange Seite für den Prüfer)."})},
                          {T: Filter(Table({Art: "Hinweis", Ebene: 0, ID: 0, KatID: 0, BerID: 0, Text: "Kein aktiver Plan: Der Rundgang erscheint nie auf der Startseite. → In der Übersicht „Plan“ tippen."}), !varIstVorlage && IsEmpty(Filter(colPlanR, Coalesce(Aktiv, false))))}
                      ),
                      T
                  ),
                  If(Art = "Fehler", 0, 1)
              )
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =52
            Width: =Parent.Width - 32
            X: =16
            Y: =384
          Children:
            - lblPrPunkt:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.Art = "Fehler", clrFehler, clrWarnung)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  Size: =12
                  Text: ="●"
                  Width: =20
                  X: =0
                  Y: =0
            - lblPrText:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  Size: =12
                  Text: =ThisItem.Text
                  Width: =Parent.TemplateWidth - 26
                  X: =22
                  Y: =0
            - btnPrZeile:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  HoverColor: =Color.White
                  HoverFill: =RGBA(23, 20, 150, 0.06)
                  OnSelect: |-
                    =If(!varIsLoading && ThisItem.Ebene > 0,
                        If(ThisItem.Ebene = 3,
                            Set(varAuswahlEbene, 3);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.BerID);
                            Set(varCtxK, ThisItem.KatID);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW),
                        ThisItem.Ebene = 2,
                            Set(varAuswahlEbene, 2);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.BerID);
                            Set(varCtxK, ThisItem.ID);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW),
                        ThisItem.Ebene = 1,
                            Set(varAuswahlEbene, 1);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.ID);
                            Set(varCtxK, 0);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW)
                        )
                    )
                  PressedColor: =Color.White
                  PressedFill: =RGBA(23, 20, 150, 0.12)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =14
                  Text: =""
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - lblPrLeer:
          Control: Label@2.5.1
          Properties:
            Color: =clrErfolg
            Font: =Font.'Segoe UI'
            Height: =40
            Size: =13
            Text: ="Alles in Ordnung ✓"
            Visible: =IsEmpty(galPr.AllItems)
            Width: =Parent.Width - 32
            X: =16
            Y: =384
