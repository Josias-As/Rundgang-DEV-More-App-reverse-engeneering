- conEdRechts:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =clrRahmen
      BorderThickness: =1
      Fill: =clrKarte
      Height: =Parent.Height - 64
      Width: =Parent.Width - 940
      X: =940
      Y: =64
    Children:
      - lblVsTitel:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =14
            Text: =Switch(varAuswahlEbene, 3, "Vorschau – so sieht es der Prüfer", 2, "Diese Seite enthält", 1, "Dieser Bereich enthält", "Vorschau")
            Width: =Parent.Width - 32
            X: =16
            Y: =6
      - conVsKarte:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =clrRahmen
            BorderThickness: =1
            Fill: =clrKarte
            Height: =300
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =varAuswahlEbene = 3
            Width: =Parent.Width - 32
            X: =16
            Y: =40
          Children:
            - lblVsFrage:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  Size: =15
                  Text: =LookUp(colP, ID = varAuswahlID).Title & If(Coalesce(LookUp(colP, ID = varAuswahlID).Pflicht, false), " *", "")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =8
            - lblVsHinweis:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =22
                  Size: =12
                  Text: =Coalesce(LookUp(colP, ID = varAuswahlID).Hinweis, "")
                  Width: =Parent.Width - 32
                  Wrap: =false
                  X: =16
                  Y: =52
            - btnVsIO:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrErfolg
                  DisabledColor: =clrErfolg
                  DisabledFill: =clrErfolgHell
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =14
                  Text: =If(Trim(Coalesce(LookUp(colP, ID = varAuswahlID).TextIO, "")) = "", "i.O.", LookUp(colP, ID = varAuswahlID).TextIO)
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "IONIO")
                  Width: =If(Max(Len(Coalesce(LookUp(colP, ID = varAuswahlID).TextIO, "")), Len(Coalesce(LookUp(colP, ID = varAuswahlID).TextNIO, ""))) > 8, 200, 120)
                  X: =16
                  Y: =80
            - btnVsNIO:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrFehler
                  DisabledColor: =clrFehler
                  DisabledFill: =clrFehlerHell
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =14
                  Text: =If(Trim(Coalesce(LookUp(colP, ID = varAuswahlID).TextNIO, "")) = "", "n.i.O.", LookUp(colP, ID = varAuswahlID).TextNIO)
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "IONIO")
                  Width: =If(Max(Len(Coalesce(LookUp(colP, ID = varAuswahlID).TextIO, "")), Len(Coalesce(LookUp(colP, ID = varAuswahlID).TextNIO, ""))) > 8, 200, 120)
                  X: =24 + btnVsIO.Width
                  Y: =80
            - txtVsWert:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Vorschau Eingabe"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  Default: =""
                  DisplayMode: =DisplayMode.Disabled
                  Fill: =clrKarte
                  FocusedBorderColor: =clrPrimaer
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HintText: =If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL"), "Wert", "Eingabe")
                  HoverBorderColor: =clrPrimaer
                  OnChange: =false
                  Size: =14
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL" || LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "TEXT")
                  Width: =If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL"), 160, Parent.Width - 32)
                  X: =16
                  Y: =80
            - lblVsEinheit:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Size: =14
                  Text: =Coalesce(LookUp(colP, ID = varAuswahlID).Einheit, "")
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "ZAHL")
                  Width: =Parent.Width - 200
                  X: =184
                  Y: =80
            - ddVsAuswahl:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Vorschau Auswahl"
                  AllowEmptySelection: =true
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  ChevronBackground: =clrPrimaer
                  ChevronFill: =Color.White
                  ChevronHoverBackground: =ColorFade(clrPrimaer, -20%)
                  ChevronHoverFill: =Color.White
                  Color: =clrText
                  Default: =""
                  DisplayMode: =DisplayMode.Edit
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverFill: =clrPrimaerHell
                  Items: =Filter(Split(Coalesce(LookUp(colP, ID = varAuswahlID).Auswahlwerte, ""), ";"), Trim(Value) <> "")
                  Items.Value: =Value
                  OnChange: =false
                  PaddingLeft: =10
                  PressedColor: =Color.White
                  PressedFill: =clrPrimaer
                  SelectionColor: =Color.White
                  SelectionFill: =clrPrimaer
                  Size: =14
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "AUSWAHL")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsMehr:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =84
                  Size: =13
                  Text: =Concat(Filter(Split(Coalesce(LookUp(colP, ID = varAuswahlID).Auswahlwerte, ""), ";"), Trim(Value) <> "") As s, "☐ " & Trim(s.Value), Char(10))
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "MEHRFACH")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsDatum:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Size: =14
                  Text: |-
                    ="📅 TT.MM.JJJJ" & If((LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUMZEIT"), "     🕒 hh : mm", "")
                  Visible: =(LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUM" || LookUp(colP, ID = varAuswahlID).Eingabetyp.Value = "DATUMZEIT")
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =80
            - lblVsRegeln:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =124
                  Size: =12
                  Text: =false
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =170
      - lblVsListe:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            Font: =Font.'Segoe UI'
            Height: =300
            Overflow: =Overflow.Scroll
            Size: =13
            Text: =If(varAuswahlEbene = 2, Concat(Sort(Filter(colP, KategorieID = varAuswahlID), RgReihenfolge * 1000000 + ID) As p, "• " & If(Trim(Coalesce(p.Abschnitt, "")) = "", "", Trim(p.Abschnitt) & " › ") & p.Title & "  (" & fnTypName(p.Eingabetyp.Value) & If(Coalesce(p.Pflicht, false), ", Pflicht", "") & If(Coalesce(p.BedingungPunkt, 0) <> 0, ", bedingt", "") & ")", Char(10)), varAuswahlEbene = 1, Concat(Sort(Filter(colK, BereichID = varAuswahlID), RgReihenfolge * 1000000 + ID) As k, "• " & k.Title & "  (" & CountRows(Filter(colP, KategorieID = k.ID)) & " Prüfpunkte)", Char(10)), "Links etwas antippen.")
            VerticalAlign: =VerticalAlign.Top
            Visible: =varAuswahlEbene <> 3
            Width: =Parent.Width - 32
            X: =16
            Y: =40
      - lblPrTitel:
          Control: Label@2.5.1
          Properties:
            Color: =If(CountRows(Filter(galPr.AllItems, Art = "Fehler")) > 0, clrFehler, clrErfolg)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =14
            Text: |-
              ="Prüfung: " & If(CountRows(Filter(galPr.AllItems, Art = "Fehler")) = 0, "keine Fehler", CountRows(Filter(galPr.AllItems, Art = "Fehler")) & " Fehler") & If(CountRows(Filter(galPr.AllItems, Art = "Hinweis")) > 0, ", " & CountRows(Filter(galPr.AllItems, Art = "Hinweis")) & " Hinweise", "")
            Width: =Parent.Width - 32
            X: =16
            Y: =350
      - galPr:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Prüfung des Rundgangs"
            Height: =Parent.Height - 392
            Items: |-
              =Table({Art: "Hinweis", Ebene: 0, ID: 0, KatID: 0, BerID: 0, Text: ""})
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =52
            Width: =Parent.Width - 32
            X: =16
            Y: =384
          Children:
            - lblPrPunkt:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.Art = "Fehler", clrFehler, clrWarnung)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  Size: =12
                  Text: ="●"
                  Width: =20
                  X: =0
                  Y: =0
            - lblPrText:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  Size: =12
                  Text: =ThisItem.Text
                  Width: =Parent.TemplateWidth - 26
                  X: =22
                  Y: =0
            - btnPrZeile:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 0, 0, 0)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.TemplateHeight
                  HoverColor: =Color.White
                  HoverFill: =RGBA(23, 20, 150, 0.06)
                  OnSelect: |-
                    =If(!varIsLoading && ThisItem.Ebene > 0,
                        If(ThisItem.Ebene = 3,
                            Set(varAuswahlEbene, 3);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.BerID);
                            Set(varCtxK, ThisItem.KatID);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW);
                            Reset(txtPAbschnitt);
                            Reset(txtPTextIO);
                            Reset(txtPTextNIO),
                        ThisItem.Ebene = 2,
                            Set(varAuswahlEbene, 2);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.BerID);
                            Set(varCtxK, ThisItem.ID);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW);
                            Reset(txtPAbschnitt);
                            Reset(txtPTextIO);
                            Reset(txtPTextNIO),
                        ThisItem.Ebene = 1,
                            Set(varAuswahlEbene, 1);
                            Set(varAuswahlID, ThisItem.ID);
                            Set(varCtxB, ThisItem.ID);
                            Set(varCtxK, 0);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW);
                            Reset(txtPAbschnitt);
                            Reset(txtPTextIO);
                            Reset(txtPTextNIO)
                        )
                    )
                  PressedColor: =Color.White
                  PressedFill: =RGBA(23, 20, 150, 0.12)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =14
                  Text: =""
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - lblPrLeer:
          Control: Label@2.5.1
          Properties:
            Color: =clrErfolg
            Font: =Font.'Segoe UI'
            Height: =40
            Size: =13
            Text: ="Alles in Ordnung ✓"
            Visible: =IsEmpty(galPr.AllItems)
            Width: =Parent.Width - 32
            X: =16
            Y: =384
