- btnPlNeu:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =Color.White
      DisabledBorderColor: =clrGesperrtHell
      DisabledColor: =clrGesperrt
      DisabledFill: =clrGesperrtHell
      DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =clrPrimaer
      Font: =Font.'Segoe UI'
      Height: =48
      HoverColor: =Color.White
      HoverFill: =ColorFade(clrPrimaer, -20%)
      OnSelect: |-
        =If(!varIsLoading && Now() >= varSperreBis,
            Set(varSperreBis, DateAdd(Now(), 1, TimeUnit.Seconds));
            Set(varPatchFehler, false);
            IfError(Patch(RG_Plan, Defaults(RG_Plan), {Title: Left(varPlanRg.Title & " – Montag", 255), RundgangID: varPlanRgID, Wochentag: 1, ZyklusWochen: 1, StartMontag: fnMontag(Today()), Aktiv: true}), Set(varPatchFehler, true));
            ClearCollect(colPlanR, Filter(RG_Plan, RundgangID = varPlanRgID));
            If(varPatchFehler, Notify("Anlegen fehlgeschlagen.", NotificationType.Error))
        )
      PressedColor: =Color.White
      PressedFill: =ColorFade(clrPrimaer, -35%)
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =14
      Text: ="+ Termin hinzufügen"
      Width: =240
      X: =24
      Y: =Parent.Height - 68
