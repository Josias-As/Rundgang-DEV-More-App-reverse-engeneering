- conEdMitte:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderThickness: =0
      Fill: =clrHintergrund
      Height: =Parent.Height - 64
      Width: =560
      X: =380
      Y: =64
    Children:
      - conEdLeiste:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            Fill: =clrHintergrund
            Height: =52
            Visible: =varAuswahlEbene > 0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - lblEdArt:
                Control: Label@2.5.1
                Properties:
                  Color: =If(Left(varFrage, 3) = "del", clrWarnung, clrText)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =52
                  Size: =If(Left(varFrage, 3) = "del", 12, 16)
                  Text: =If(Left(varFrage, 3) = "del", If(varAuswahlEbene = 1, "Entfernt den Bereich mit " & CountRows(Filter(colK, BereichID = varAuswahlID)) & " Kategorien und " & CountRows(Filter(colP, KategorieID in Filter(colK, BereichID = varAuswahlID).ID)) & " Prüfpunkten. Nochmal tippen.", varAuswahlEbene = 2, "Entfernt die Kategorie mit " & CountRows(Filter(colP, KategorieID = varAuswahlID)) & " Prüfpunkten. Nochmal tippen.", "Entfernt den Prüfpunkt. Nochmal tippen."), Switch(varAuswahlEbene, 1, "Bereich", 2, "Kategorie", "Prüfpunkt"))
                  Width: =If(Left(varFrage, 3) = "del", 360, 130)
                  X: =16
                  Y: =0
            - btnEdHoch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =16
                  Text: ="↑"
                  Visible: =varSchreibbar && Left(varFrage, 3) <> "del"
                  Width: =44
                  X: =150
                  Y: =6
            - btnEdRunter:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: =false
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =16
                  Text: ="↓"
                  Visible: =varSchreibbar && Left(varFrage, 3) <> "del"
                  Width: =44
                  X: =200
                  Y: =6
            - btnEdDupl:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrPrimaer
                  BorderThickness: =1
                  Color: =clrPrimaer
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrPrimaer
                  HoverFill: =clrPrimaerHell
                  OnSelect: |-
                    =If(varSchreibbar && varAuswahlEbene > 0 && !varIsLoading && Now() >= varSperreBis,
                        Set(varSperreBis, DateAdd(Now(), 1, TimeUnit.Seconds));
                        Refresh(RG_Rundgaenge);
                        Set(varEntwurfOk, varIstVorlage || Coalesce(LookUp(RG_Rundgaenge, ID = varRgID).EntwurfFassung, 0) = varFassung);
                        If(!varEntwurfOk, Set(varSchreibbar, false); Notify("Dieser Entwurf ist nicht mehr offen (inzwischen aktiviert oder verworfen). Nichts wurde geändert. Bitte zur Übersicht.", NotificationType.Error));
                        If(varEntwurfOk,
                        ClearCollect(colQB, Filter(colB, varAuswahlEbene = 1 && ID = varAuswahlID));
                        ClearCollect(colQK, Filter(colK, (varAuswahlEbene = 2 && ID = varAuswahlID) || (varAuswahlEbene = 1 && BereichID = varAuswahlID)));
                        ClearCollect(colQP, Filter(colP, (varAuswahlEbene = 3 && ID = varAuswahlID) || KategorieID in colQK.ID));
                        Set(varZielR, varRgID);
                        Set(varZielF, varFassung);
                        Set(varZielB, varCtxB);
                        Set(varZielK, varCtxK);
                        Set(varZielBAktiv, false);
                        Set(varKopieBehalteR, false);
                        Set(varKopieZusatz, " (Kopie)");
                        Set(varKopieNach, "auswahl");
                        Set(varJob, "kopie");
                        Set(varIsLoading, true);
                        Set(varArbeitStart, true)
                        )
                    )
                  PressedColor: =clrPrimaer
                  PressedFill: =clrPrimaerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =13
                  Text: ="Duplizieren"
                  Visible: =varSchreibbar && Left(varFrage, 3) <> "del"
                  Width: =120
                  X: =252
                  Y: =6
            - btnEdEntf:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =clrFehler
                  BorderThickness: =1
                  Color: =clrFehler
                  DisabledBorderColor: =clrGesperrtHell
                  DisabledColor: =clrGesperrt
                  DisabledFill: =clrGesperrtHell
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HoverColor: =clrFehler
                  HoverFill: =clrFehlerHell
                  OnSelect: =false
                  PressedColor: =clrFehler
                  PressedFill: =clrFehlerHell
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =13
                  Text: =If(varFrage = "del" & varAuswahlEbene & "-" & varAuswahlID, "Ja, entfernen", "Entfernen")
                  Visible: =varSchreibbar
                  Width: =160
                  X: =384
                  Y: =6
      - conEdLeer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            Fill: =clrHintergrund
            Height: =300
            Visible: =varAuswahlEbene = 0
            Width: =528
            X: =16
            Y: =56
          Children:
            - lblLeerHilfe:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Font: =Font.'Segoe UI'
                  Height: =240
                  Size: =14
                  Text: =If(!varSchreibbar, "Links einen Bereich, eine Kategorie oder einen Prüfpunkt antippen.", IsEmpty(colB), "So geht es:" & Char(10) & "1. Links „+ Bereich“ (z. B. Lagerhalle)." & Char(10) & "2. „+ Kategorie“ (z. B. Teilelager) – eine Seite für den Prüfer." & Char(10) & "3. „+ Prüfpunkt“ oder „Mehrere Fragen …“ oder „Aus Vorlage holen …“." & Char(10) & "4. Rechts unten zeigt die Prüfung, was noch fehlt. Dann oben „Aktivieren“.", "Links einen Bereich, eine Kategorie oder einen Prüfpunkt antippen.")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =528
                  X: =0
                  Y: =0
      - conEdB:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            Fill: =clrHintergrund
            Height: =Parent.Height - 56
            Visible: =varAuswahlEbene = 1
            Width: =528
            X: =16
            Y: =56
          Children:
            - lblBName:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =20
                  Size: =12
                  Text: ="Name des Bereichs"
                  Width: =528
                  X: =0
                  Y: =0
            - txtBName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Name des Bereichs"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  Default: =Coalesce(LookUp(colB, ID = varAuswahlID).Title, "")
                  DisplayMode: =If(varSchreibbar && !varIsLoading, DisplayMode.Edit, DisplayMode.View)
                  Fill: =clrKarte
                  FocusedBorderColor: =clrPrimaer
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HintText: ="z. B. Lagerhalle"
                  HoverBorderColor: =clrPrimaer
                  OnChange: |-
                    =If(Trim(Self.Text) = "",
                        Reset(txtBName),
                        Self.Text <> LookUp(colB, ID = varAuswahlID).Title,
                        If(varSchreibbar && varAuswahlEbene = 1,
                            Refresh(RG_Rundgaenge);
                            Set(varEntwurfOk, varIstVorlage || Coalesce(LookUp(RG_Rundgaenge, ID = varRgID).EntwurfFassung, 0) = varFassung);
                            If(!varEntwurfOk, Set(varSchreibbar, false); Notify("Dieser Entwurf ist nicht mehr offen (inzwischen aktiviert oder verworfen). Nichts wurde geändert. Bitte zur Übersicht.", NotificationType.Error));
                            If(varEntwurfOk,
                                Set(varPatchFehler, false);
                                IfError(Patch(RG_Bereiche, LookUp(RG_Bereiche, ID = varAuswahlID && RundgangID = varRgID && Fassung = varFassung), {Title: Left(Trim(Self.Text), 255)}), Set(varPatchFehler, true));
                                If(varPatchFehler,
                                    Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                                    Patch(colB, LookUp(colB, ID = varAuswahlID), LookUp(RG_Bereiche, ID = varAuswahlID));
                                    Set(varGespeichertText, "Gespeichert " & Text(Now(), "hh:mm:ss"))
                                )
                            )
                        )
                    )
                  Size: =14
                  Width: =528
                  X: =0
                  Y: =20
            - lblBZeigen:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =20
                  Size: =12
                  Text: ="Name für den Prüfer"
                  Width: =528
                  X: =0
                  Y: =72
            - galBZeigen:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Bereichsname zeigen"
                  Height: =36
                  Items: |-
                    =Table({W: "zeigen", N: "zeigen"}, {W: "aus", N: "ausblenden"})
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =36
                  Width: =300
                  WrapCount: =2
                  X: =0
                  Y: =92
                Children:
                  - btnBZeigen:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), clrPrimaer, clrRahmen)
                        BorderThickness: =1
                        Color: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), Color.White, clrText)
                        DisabledBorderColor: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), clrPrimaer, clrRahmen)
                        DisabledColor: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), clrPrimaer, clrTextGrau)
                        DisabledFill: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), clrPrimaerHell, clrKarte)
                        DisplayMode: =If(varSchreibbar && !varIsLoading, DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), clrPrimaer, clrKarte)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        HoverColor: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), Color.White, clrText)
                        HoverFill: =If(ThisItem.W = If(Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false), "aus", "zeigen"), ColorFade(clrPrimaer, -20%), clrPrimaerHell)
                        OnSelect: |-
                          =If((ThisItem.W = "aus") <> Coalesce(LookUp(colB, ID = varAuswahlID).Ausblenden, false),
                              If(varSchreibbar && varAuswahlEbene = 1,
                                  Refresh(RG_Rundgaenge);
                                  Set(varEntwurfOk, varIstVorlage || Coalesce(LookUp(RG_Rundgaenge, ID = varRgID).EntwurfFassung, 0) = varFassung);
                                  If(!varEntwurfOk, Set(varSchreibbar, false); Notify("Dieser Entwurf ist nicht mehr offen (inzwischen aktiviert oder verworfen). Nichts wurde geändert. Bitte zur Übersicht.", NotificationType.Error));
                                  If(varEntwurfOk,
                                      Set(varPatchFehler, false);
                                      IfError(Patch(RG_Bereiche, LookUp(RG_Bereiche, ID = varAuswahlID && RundgangID = varRgID && Fassung = varFassung), {Ausblenden: ThisItem.W = "aus"}), Set(varPatchFehler, true));
                                      If(varPatchFehler,
                                          Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                                          Patch(colB, LookUp(colB, ID = varAuswahlID), LookUp(RG_Bereiche, ID = varAuswahlID));
                                          Set(varGespeichertText, "Gespeichert " & Text(Now(), "hh:mm:ss"))
                                      )
                                  )
                              )
                          )
                        PressedColor: =Color.White
                        PressedFill: =ColorFade(clrPrimaer, -35%)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =13
                        Text: =ThisItem.N
                        Width: =Parent.TemplateWidth - 6
                        X: =0
                        Y: =0
            - lblBInfo:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =180
                  Size: =13
                  Text: |-
                    ="Enthält " & CountRows(Filter(colK, BereichID = varAuswahlID)) & " Kategorien und " & CountRows(Filter(colP, KategorieID in Filter(colK, BereichID = varAuswahlID).ID)) & " Prüfpunkte." & Char(10) & Char(10) & "Ein Bereich ist eine Überschrift im Rundgang (z. B. „Lagerhalle“). Darin liegen die Kategorien. Neue Kategorie: links „+ Kategorie“." & Char(10) & Char(10) & "„ausblenden“: Der Prüfer sieht nur die Kategorien. Sinnvoll, wenn der Rundgang nur einen Bereich hat."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =528
                  X: =0
                  Y: =140
      - conEdK:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            Fill: =clrHintergrund
            Height: =Parent.Height - 56
            Visible: =varAuswahlEbene = 2
            Width: =528
            X: =16
            Y: =56
          Children:
            - lblKName:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =20
                  Size: =12
                  Text: ="Name der Kategorie"
                  Width: =528
                  X: =0
                  Y: =0
            - txtKName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Name der Kategorie"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  Default: =Coalesce(LookUp(colK, ID = varAuswahlID).Title, "")
                  DisplayMode: =If(varSchreibbar && !varIsLoading, DisplayMode.Edit, DisplayMode.View)
                  Fill: =clrKarte
                  FocusedBorderColor: =clrPrimaer
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HintText: ="z. B. Teilelager"
                  HoverBorderColor: =clrPrimaer
                  OnChange: |-
                    =If(Trim(Self.Text) = "",
                        Reset(txtKName),
                        Self.Text <> LookUp(colK, ID = varAuswahlID).Title,
                        If(varSchreibbar && varAuswahlEbene = 2,
                            Refresh(RG_Rundgaenge);
                            Set(varEntwurfOk, varIstVorlage || Coalesce(LookUp(RG_Rundgaenge, ID = varRgID).EntwurfFassung, 0) = varFassung);
                            If(!varEntwurfOk, Set(varSchreibbar, false); Notify("Dieser Entwurf ist nicht mehr offen (inzwischen aktiviert oder verworfen). Nichts wurde geändert. Bitte zur Übersicht.", NotificationType.Error));
                            If(varEntwurfOk,
                                Set(varPatchFehler, false);
                                IfError(Patch(RG_Kategorien, LookUp(RG_Kategorien, ID = varAuswahlID && RundgangID = varRgID && Fassung = varFassung), {Title: Left(Trim(Self.Text), 255)}), Set(varPatchFehler, true));
                                If(varPatchFehler,
                                    Notify("Nicht gespeichert. Bitte erneut versuchen.", NotificationType.Error),
                                    Patch(colK, LookUp(colK, ID = varAuswahlID), LookUp(RG_Kategorien, ID = varAuswahlID));
                                    Set(varGespeichertText, "Gespeichert " & Text(Now(), "hh:mm:ss"))
                                )
                            )
                        )
                    )
                  Size: =14
                  Width: =528
                  X: =0
                  Y: =20
            - lblKBereich:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =20
                  Size: =12
                  Text: ="Gehört zum Bereich"
                  Width: =528
                  X: =0
                  Y: =72
            - ddKBereich:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Bereich (verschieben)"
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  ChevronBackground: =clrPrimaer
                  ChevronFill: =Color.White
                  ChevronHoverBackground: =ColorFade(clrPrimaer, -20%)
                  ChevronHoverFill: =Color.White
                  Color: =clrText
                  Default: |-
                    =With({b: LookUp(colB, ID = LookUp(colK, ID = varAuswahlID).BereichID)}, b.Title & If(CountRows(Filter(colB As x, x.Title = b.Title)) > 1, " (#" & b.ID & ")", ""))
                  DisplayMode: =If(varSchreibbar && !varIsLoading, DisplayMode.Edit, DisplayMode.View)
                  Fill: =clrKarte
                  Font: =Font.'Segoe UI'
                  Height: =36
                  HoverFill: =clrPrimaerHell
                  Items: |-
                    =Sort(ForAll(colB As b, {ID: b.ID, N: b.Title & If(CountRows(Filter(colB As x, x.Title = b.Title)) > 1, " (#" & b.ID & ")", ""), S: Text(b.RgReihenfolge, "000000") & Text(b.ID, "000000")}), S)
                  Items.Value: =N
                  OnChange: |-
                    =If(!IsBlank(Self.Selected) && Self.Selected.ID <> LookUp(colK, ID = varAuswahlID).BereichID && varSchreibbar,
                        Refresh(RG_Rundgaenge);
                        Set(varEntwurfOk, varIstVorlage || Coalesce(LookUp(RG_Rundgaenge, ID = varRgID).EntwurfFassung, 0) = varFassung);
                        If(!varEntwurfOk, Set(varSchreibbar, false); Notify("Dieser Entwurf ist nicht mehr offen (inzwischen aktiviert oder verworfen). Nichts wurde geändert. Bitte zur Übersicht.", NotificationType.Error));
                        If(varEntwurfOk,
                        With({ziel: Self.Selected.ID},
                            Set(varPatchFehler, false);
                            IfError(Patch(RG_Kategorien, LookUp(RG_Kategorien, ID = varAuswahlID && RundgangID = varRgID && Fassung = varFassung), {BereichID: ziel, RgReihenfolge: Coalesce(Max(Filter(colK, BereichID = ziel), RgReihenfolge), 0) + 10}), Set(varPatchFehler, true));
                            ClearCollect(colK, Filter(RG_Kategorien, RundgangID = varRgID && Fassung = varFassung));
                            If(varPatchFehler, Notify("Verschieben hat nicht geklappt.", NotificationType.Error), Notify("Verschoben (ans Ende des Bereichs).", NotificationType.Success));
                            Set(varAuswahlEbene, 2);
                            Set(varAuswahlID, varAuswahlID);
                            Set(varCtxB, ziel);
                            Set(varCtxK, varAuswahlID);
                            Set(varFrage, "");
                            Reset(txtBName);
                            Reset(txtKName);
                            Reset(ddKBereich);
                            Reset(txtPFrage);
                            Reset(txtPEinheit);
                            Reset(txtPMin);
                            Reset(txtPMax);
                            Reset(txtPWerte);
                            Reset(txtPHinweis);
                            Reset(ddPKategorie);
                            Reset(ddPBedA);
                            Reset(ddPBedW);
                            Reset(txtPAbschnitt);
                            Reset(txtPTextIO);
                            Reset(txtPTextNIO)
                        ))
                    )
                  PaddingLeft: =10
                  PressedColor: =Color.White
                  PressedFill: =clrPrimaer
                  SelectionColor: =Color.White
                  SelectionFill: =clrPrimaer
                  Size: =14
                  Width: =528
                  X: =0
                  Y: =92
            - lblKInfo:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =140
                  Size: =13
                  Text: |-
                    =CountRows(Filter(colP, KategorieID = varAuswahlID)) & " Prüfpunkte." & Char(10) & Char(10) & "Eine Kategorie ist eine Seite im Rundgang: Der Prüfer füllt sie aus und speichert sie als Ganzes. Der Prüfer kann die Kategorien in beliebiger Reihenfolge ausfüllen. Neuer Prüfpunkt: links „+ Prüfpunkt“."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =528
                  X: =0
                  Y: =140
      - conEdP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            Fill: =clrHintergrund
            Height: =Parent.Height - 56
            Visible: =varAuswahlEbene = 3
            Width: =528
            X: =16
            Y: =56
          Children:
            - lblPFrage:
                Control: Label@2.5.1
                Properties:
                  Color: =clrTextGrau
                  Font: =Font.'Segoe UI'
                  Height: =20
                  Size: =12
                  Text: ="Frage"
                  Width: =528
                  X: =0
                  Y: =0
            - txtPFrage:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Frage des Prüfpunkts"
                  BorderColor: =clrRahmen
                  Color: =clrText
                  Default: =Coalesce(LookUp(colP, ID = varAuswahlID).Title, "")
                  DisplayMode: =If(varSchreibbar && !varIsLoading, DisplayMode.Edit, DisplayMode.View)
                  Fill: =clrKarte
                  FocusedBorderColor: =clrPrimaer
                  Font: =Font.'Segoe UI'
                  Height: =40
                  HintText: ="Frage, z. B. Lager sauber?"
                  HoverBorderColor: =clrPrimaer
                  OnChange: |-
                    =If(Trim(Self.Text) = "",
                        Reset(txtPFrage),
                        Self.Text <> LookUp(colP, ID = varAuswahlID).Title,
